<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إشعار جاهزية العباية - بازار العبايات</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      width: 100%;
      max-width: 400px;
    }
    .header {
      text-align: center;
      margin-bottom: 25px;
    }
    .header h2 {
      margin: 0 0 8px 0;
      color: #1a1a1a;
      font-size: 22px;
      font-weight: 700;
    }
    .header p {
      margin: 0;
      color: #666;
      font-size: 13px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }
    input, select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e1e4e8;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
      color: #222;
      background-color: #fafafa;
      transition: all 0.2s ease;
    }
    input:focus, select:focus {
      border-color: #25D366;
      background-color: #fff;
      box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.15);
      outline: none;
    }
    .btn-whatsapp {
      background-color: #25D366;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background-color 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.25);
    }
    .btn-whatsapp:hover {
      background-color: #20bd5a;
    }
    .btn-whatsapp:active {
      transform: scale(0.98);
    }
    .btn-whatsapp svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }
    .note {
      font-size: 12px;
      color: #888;
      margin-top: 15px;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <h2>إشعار جاهزية العباية 🌸</h2>
    <p>إرسال رسالة مباشرة للعميل عبر الواتساب</p>
  </div>

  <div class="form-group">
    <label for="branch">المحل / الفرع:</label>
    <select id="branch">
      <option value="همسات نور">همسات نور</option>
      <option value="لمسة وتصميم">لمسة وتصميم</option>
      <option value="طيف الرشا">طيف الرشا</option>
      <option value="الوان حرير">الوان حرير</option>
    </select>
  </div>

  <div class="form-group">
    <label for="invoiceNumber">رقم الفاتورة:</label>
    <input type="text" id="invoiceNumber" placeholder="مثال: 1045" inputmode="numeric">
  </div>

  <div class="form-group">
    <label for="phoneNumber">رقم جوال العميل:</label>
    <input type="tel" id="phoneNumber" placeholder="05XXXXXXXX">
  </div>

  <button class="btn-whatsapp" onclick="sendWhatsAppNotification()">
    <svg viewBox="0 0 24 24">
      <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
    </svg>
    <span>إرسال عبر واتساب</span>
  </button>

  <p class="note">سيتم فتح الواتساب مباشرة برقم العميل مع الرسالة جاهزة للإرسال.</p>
</div>

<script>
function formatSaudiPhoneNumber(phone) {
  let cleaned = phone.replace(/\D/g, '');

  if (cleaned.startsWith('05')) {
    cleaned = '966' + cleaned.substring(1);
  } else if (cleaned.startsWith('5') && cleaned.length === 9) {
    cleaned = '966' + cleaned;
  }

  return cleaned;
}

function sendWhatsAppNotification() {
  const branch = document.getElementById('branch').value;
  const invoice = document.getElementById('invoiceNumber').value.trim();
  const rawPhone = document.getElementById('phoneNumber').value.trim();

  if (!invoice || !rawPhone) {
    alert('يرجى إدخال رقم الفاتورة ورقم الجوال أولاً.');
    return;
  }

  const formattedPhone = formatSaudiPhoneNumber(rawPhone);

  if (formattedPhone.length < 12) {
    alert('يرجى التأكد من صحة رقم الجوال (مثال: 0512345678).');
    return;
  }

  const messageText = ` أهلاً وسهلاً بكِ عزيزتي العميلة🌸

يسعدنا إبلاغكِ بأن عبايتكِ الخاصة بالفاتورة رقم *(${invoice})* أصبحت جاهزة للاستلام ✨

📍 *الفرع: [${branch}]*

نسعد بزيارتكِ واستلام طلبكِ في الوقت الذي يناسبكِ 🤍

✨ *تصفحي أحدث منتجاتنا عبر الموقع الموحد:*
https://www.tiktok.com/@bazar_abayat

شكرًا لثقتكِ بنا، ونسعد دائمًا بخدمتكِ 🌷`;

  const encodedMessage = encodeURIComponent(messageText);
  const whatsappUrl = `https://api.whatsapp.com/send?phone=${formattedPhone}&text=${encodedMessage}`;

  window.open(whatsappUrl, '_blank');
}
</script>

</body>
</html>

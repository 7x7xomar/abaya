<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إشعار جاهزية العباية - واتساب</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 420px;
    }
    h2 {
      margin-top: 0;
      color: #333;
      font-size: 20px;
      text-align: center;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #555;
      font-size: 14px;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 15px;
    }
    input:focus, select:focus {
      border-color: #25D366;
      outline: none;
    }
    .btn-whatsapp {
      background-color: #25D366;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s;
    }
    .btn-whatsapp:hover {
      background-color: #1ebc57;
    }
    .note {
      font-size: 12px;
      color: #777;
      margin-top: 12px;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>إرسال إشعار العباية (واتساب)</h2>

  <div class="form-group">
    <label for="branch">المحل / الفرع:</label>
    <select id="branch">
      <!-- <option value="الفرع الرئيسي">الفرع الرئيسي</option> -->
      <option value=" همسات نور">همسات نور </option>
      <option value="لمسة وتصميم">لمسة وتصميم </option>
      <option value="طيف الرشا">طيف الرشا </option>
      <option value="الوان حرير">الوان حرير </option>
    </select>
  </div>

  <div class="form-group">
    <label for="invoiceNumber">رقم الفاتورة:</label>
    <input type="text" id="invoiceNumber" placeholder="مثال: 1045">
  </div>

  <div class="form-group">
    <label for="phoneNumber">رقم جوال العميل:</label>
    <input type="tel" id="phoneNumber" placeholder="05XXXXXXXX">
  </div>

  <button class="btn-whatsapp" onclick="sendWhatsAppNotification()">
    <span>إرسال عبر واتساب</span>
  </button>

  <p class="note">سيتم فتح الواتساب مباشرة برسالة جاهزة للضغط على إرسال.</p>
</div>

<script>
function formatSaudiPhoneNumber(phone) {
  // إزالة أي مسافات أو رموز خاصة
  let cleaned = phone.replace(/\D/g, '');

  // تحويل الرقم إلى الصيغة الدولية للسعودية (966)
  if (cleaned.startsWith('05')) {
    cleaned = '966' + cleaned.substring(1);
  } else if (cleaned.startsWith('5') && cleaned.length === 9) {
    cleaned = '966' + cleaned;
  }

  return cleaned;
}

function sendWhatsAppNotification() {
  const branch = document.getElementById('branch').value;
  const invoice = document.getElementById('invoiceNumber').value.trim();
  const rawPhone = document.getElementById('phoneNumber').value.trim();

  if (!invoice || !rawPhone) {
    alert('يرجى إدخال رقم الفاتورة ورقم الجوال أولاً.');
    return;
  }

  const formattedPhone = formatSaudiPhoneNumber(rawPhone);

  if (formattedPhone.length < 12) {
    alert('يرجى التأكد من صحة رقم الجوال (مثال: 0512345678).');
    return;
  }

  // نص الرسالة المجهزة
  const messageText = `🌸 أهلاً وسهلاً بكِ عزيزتي العميلة،

يسعدنا إبلاغكِ بأن عبايتكِ الخاصة بالفاتورة رقم (${invoice}) من فرع [${branch}] أصبحت جاهزة للاستلام ✨

نسعد بزيارتكِ واستلام طلبكِ في الوقت الذي يناسبكِ 🤍

✨ تصفحي أحدث منتجاتنا عبر الموقع الموحد:
https://www.tiktok.com/@bazar_abayat

شكرًا لثقتكِ بنا، ونسعد دائمًا بخدمتكِ 🌷`;

  // تحويل النص إلى صيغة URL Encoded للروابط
  const encodedMessage = encodeURIComponent(messageText);

  // انشاء رابط واتساب المباشر
  const whatsappUrl = `https://api.whatsapp.com/send?phone=${formattedPhone}&text=${encodedMessage}`;

  // فتح الرابط في نافذة جديدة
  window.open(whatsappUrl, '_blank');
}
</script>

</body>
</html>
